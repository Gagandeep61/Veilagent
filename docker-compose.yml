version: '3.8'

services:
  veilagent-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: veilagent-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - MOCK_VLM=${MOCK_VLM:-true}
      - ALLOWED_EXTENSION_ORIGIN=${ALLOWED_EXTENSION_ORIGIN:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  veilagent-demo:
    image: nginx:alpine
    container_name: veilagent-demo-site
    ports:
      - "8080:80"
    volumes:
      - ./demo-site:/usr/share/nginx/html:ro
    restart: unless-stopped
